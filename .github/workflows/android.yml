name: Build SWAAH APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SWAAH_Phase1_Android_Starter.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q SWAAH_Phase1_Android_Starter.zip -d /tmp/swaah
          PROJECT=$(find /tmp/swaah -name settings.gradle.kts -printf '%h\n' | head -1)
          cp -R "$PROJECT"/. .

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SWAAH-APK
          path: app/build/outputs/apk/debug/*.apk
